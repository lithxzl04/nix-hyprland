# ~/.config/kitty/kitty.conf

# ── Font ──────────────────────────────────────────────────────────────────────
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         11.0

# ── Window ────────────────────────────────────────────────────────────────────
window_padding_width     8
remember_window_size     no
confirm_os_window_close  0

# Slight transparency (works nicely with Hyprland blur). Set to 1.0 to disable.
background_opacity       0.95

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor_shape             block
cursor_blink_interval    0

# ── Scrollback and behavior ───────────────────────────────────────────────────
scrollback_lines         10000
copy_on_select           clipboard
mouse_hide_wait          3.0
enable_audio_bell        no
shell_integration        enabled
url_style                curly

# ── Tabs ──────────────────────────────────────────────────────────────────────
tab_bar_style            fade
tab_bar_min_tabs         2
tab_fade                 0.25 0.5 0.75 1
active_tab_foreground    #141414
active_tab_background    #b2d7ff
inactive_tab_foreground  #9fc0e4
inactive_tab_background  #232323

# ── Colors (palette sampled from the wallpaper) ───────────────────────────────
foreground               #b2d7ff
background               #141414
selection_foreground     #141414
selection_background     #b2d7ff

cursor                   #b2d7ff
cursor_text_color        #141414
url_color                #b2d7ff

active_border_color      #b2d7ff
inactive_border_color    #393a4b
bell_border_color        #e5c890

# black
color0   #232323
color8   #4f6473
# red
color1   #e78284
color9   #ee9fa0
# green
color2   #a6d189
color10  #bbe0a3
# yellow
color3   #e5c890
color11  #efd9ab
# blue
color4   #9fc0e4
color12  #b2d7ff
# magenta
color5   #ca9ee6
color13  #d8b4f0
# cyan
color6   #81c8be
color14  #99d6cd
# white
color7   #b8c4d6
color15  #dce6f5

# ── Keybinds (kitty defaults already cover copy/paste and font size) ──────────
map ctrl+shift+c   copy_to_clipboard
map ctrl+shift+v   paste_from_clipboard
map ctrl+shift+t   new_tab
map ctrl+shift+w   close_tab
map ctrl+shift+enter new_window
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
